<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="50%" stop-color="#190a03"/>
      <stop offset="100%" stop-color="#0c0401"/>
    </radialGradient>
    <linearGradient id="posterArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="40%" stop-color="#fdba74"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="tile1Clip"><rect x="96" y="86" width="150" height="170" rx="10"/></clipPath>
    <clipPath id="tile2Clip"><rect x="266" y="86" width="150" height="170" rx="10"/></clipPath>
    <clipPath id="tile3Clip"><rect x="96" y="272" width="150" height="170" rx="10"/></clipPath>
    <clipPath id="tile4Clip"><rect x="266" y="272" width="150" height="170" rx="10"/></clipPath>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="110" fill="url(#mbg)"/>

  <!-- CMYK / Print Registration Marks in the corners -->
  <g stroke="#fb923c" stroke-width="2" opacity="0.4" fill="none">
    <!-- Top-Left registration target -->
    <circle cx="56" cy="56" r="14"/>
    <line x1="38" y1="56" x2="74" y2="56"/>
    <line x1="56" y1="38" x2="56" y2="74"/>
    <!-- Top-Right registration target -->
    <circle cx="456" cy="56" r="14"/>
    <line x1="438" y1="56" x2="474" y2="56"/>
    <line x1="456" y1="38" x2="456" y2="74"/>
  </g>

  <!-- Tile 1: Top-Left Sheet (Hoja Carta 1) -->
  <g>
    <!-- Paper shadow & base -->
    <rect x="96" y="86" width="150" height="170" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <!-- Image slice -->
    <g clip-path="url(#tile1Clip)">
      <rect x="96" y="86" width="320" height="356" fill="url(#posterArt)"/>
      <circle cx="256" cy="264" r="95" fill="url(#sunGrad)" opacity="0.95"/>
      <path d="M 60 380 Q 180 240 320 380 Z" fill="#9a3412" opacity="0.7"/>
    </g>
    <!-- Sheet Label Badge -->
    <rect x="104" y="94" width="46" height="20" rx="6" fill="#7c2d12" opacity="0.9"/>
    <text x="127" y="108" fill="#ffedd5" font-size="10" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">HOJA 1</text>
  </g>

  <!-- Tile 2: Top-Right Sheet (Hoja Carta 2) -->
  <g>
    <rect x="266" y="86" width="150" height="170" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <g clip-path="url(#tile2Clip)">
      <rect x="96" y="86" width="320" height="356" fill="url(#posterArt)"/>
      <circle cx="256" cy="264" r="95" fill="url(#sunGrad)" opacity="0.95"/>
      <path d="M 60 380 Q 180 240 320 380 Z" fill="#9a3412" opacity="0.7"/>
      <path d="M 220 390 Q 340 260 480 390 Z" fill="#7c2d12" opacity="0.8"/>
    </g>
    <rect x="274" y="94" width="46" height="20" rx="6" fill="#7c2d12" opacity="0.9"/>
    <text x="297" y="108" fill="#ffedd5" font-size="10" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">HOJA 2</text>
  </g>

  <!-- Tile 3: Bottom-Left Sheet (Hoja Carta 3) -->
  <g>
    <rect x="96" y="272" width="150" height="170" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <g clip-path="url(#tile3Clip)">
      <rect x="96" y="86" width="320" height="356" fill="url(#posterArt)"/>
      <circle cx="256" cy="264" r="95" fill="url(#sunGrad)" opacity="0.95"/>
      <path d="M 60 380 Q 180 240 320 380 Z" fill="#9a3412" opacity="0.7"/>
      <path d="M 50 430 Q 190 320 340 430 Z" fill="#431407" opacity="0.85"/>
    </g>
    <rect x="104" y="280" width="46" height="20" rx="6" fill="#7c2d12" opacity="0.9"/>
    <text x="127" y="294" fill="#ffedd5" font-size="10" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">HOJA 3</text>
  </g>

  <!-- Tile 4: Bottom-Right Sheet (Hoja Carta 4) -->
  <g>
    <rect x="266" y="272" width="150" height="170" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <g clip-path="url(#tile4Clip)">
      <rect x="96" y="86" width="320" height="356" fill="url(#posterArt)"/>
      <circle cx="256" cy="264" r="95" fill="url(#sunGrad)" opacity="0.95"/>
      <path d="M 220 390 Q 340 260 480 390 Z" fill="#7c2d12" opacity="0.8"/>
      <path d="M 200 440 Q 330 330 460 440 Z" fill="#431407" opacity="0.85"/>
    </g>
    <rect x="274" y="280" width="46" height="20" rx="6" fill="#7c2d12" opacity="0.9"/>
    <text x="297" y="294" fill="#ffedd5" font-size="10" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">HOJA 4</text>
  </g>

  <!-- Separation / Cutting Guides (Dashed line and Scissors Icon) -->
  <g stroke="#f97316" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.85">
    <!-- Vertical cut guide -->
    <line x1="256" y1="70" x2="256" y2="456"/>
    <!-- Horizontal cut guide -->
    <line x1="80" y1="264" x2="432" y2="264"/>
  </g>

  <!-- Central Assembly & Alignment Crosshair -->
  <g filter="url(#mGlow)">
    <circle cx="256" cy="264" r="18" fill="#f97316" stroke="#ffedd5" stroke-width="3"/>
    <!-- Scissors glyph in center -->
    <path d="M 251 259 L 261 269 M 251 269 L 261 259" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Alignment crop markers around sheets -->
  <g stroke="#fdba74" stroke-width="2.5" stroke-linecap="square">
    <!-- Top-left outer mark -->
    <path d="M 82 96 L 96 96 L 96 82" fill="none"/>
    <!-- Top-right outer mark -->
    <path d="M 430 96 L 416 96 L 416 82" fill="none"/>
    <!-- Bottom-left outer mark -->
    <path d="M 82 432 L 96 432 L 96 446" fill="none"/>
    <!-- Bottom-right outer mark -->
    <path d="M 430 432 L 416 432 L 416 446" fill="none"/>
  </g>

  <!-- Bottom Badge -->
  <rect x="52" y="465" width="408" height="34" rx="17" fill="#431407" stroke="#f97316" stroke-width="1.8"/>
  <text x="256" y="488" fill="#ffedd5" font-size="14" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="2" text-anchor="middle">
    IMPRESIÓN MOSAICO POSTER
  </text>
</svg>
