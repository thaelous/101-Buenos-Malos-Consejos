<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fgrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fgrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fgrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fgrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#fbg)"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="2">
    <line x1="128" y1="40" x2="128" y2="472"/>
    <line x1="256" y1="40" x2="256" y2="472"/>
    <line x1="384" y1="40" x2="384" y2="472"/>
    <line x1="40" y1="128" x2="472" y2="128"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="384" x2="472" y2="384"/>
  </g>

  <!-- Geometric Circle Fractions (Left side) -->
  <g transform="translate(195, 230)">
    <!-- Base full outline -->
    <circle cx="0" cy="0" r="130" fill="#334155" opacity="0.4" stroke="#475569" stroke-width="3"/>
    
    <!-- Quadrant 1: 1/4 slice (Cyan) -->
    <path d="M 0 0 L 130 0 A 130 130 0 0 0 0 -130 Z" fill="url(#fgrad2)" stroke="#0f172a" stroke-width="4"/>
    
    <!-- Quadrant 2: 1/4 slice (Rose/Violet) -->
    <path d="M 0 0 L 0 -130 A 130 130 0 0 0 -130 0 Z" fill="url(#fgrad4)" stroke="#0f172a" stroke-width="4"/>
    
    <!-- Quadrant 3 & 4 (Half: 2/4 = 1/2) (Amber/Orange with explosion offset) -->
    <g transform="translate(12, 12)" filter="url(#glow)">
      <path d="M 0 0 L -130 0 A 130 130 0 0 0 130 0 Z" fill="url(#fgrad1)" stroke="#0f172a" stroke-width="4"/>
      <circle cx="0" cy="65" r="8" fill="#ffffff" opacity="0.9"/>
      <text x="0" y="72" fill="#ffffff" font-size="26" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">½</text>
    </g>

    <!-- Fraction Labels -->
    <text x="55" y="-55" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">¼</text>
    <text x="-55" y="-55" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">¼</text>
  </g>

  <!-- Geometric Cutting Bar (Right side) -->
  <g transform="translate(365, 120)">
    <!-- Bar segments -->
    <rect x="0" y="0" width="80" height="52" rx="12" fill="url(#fgrad3)" stroke="#0f172a" stroke-width="3"/>
    <text x="40" y="33" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">⅓</text>

    <rect x="0" y="60" width="80" height="52" rx="12" fill="url(#fgrad3)" stroke="#0f172a" stroke-width="3"/>
    <text x="40" y="93" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">⅓</text>

    <rect x="0" y="120" width="80" height="52" rx="12" fill="#334155" stroke="#475569" stroke-width="3" opacity="0.6"/>
    <text x="40" y="153" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">⅓</text>

    <!-- Cut cutter indicator knife/spark -->
    <path d="M -15 116 L 95 116" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6,4" />
    <polygon points="95,116 110,111 110,121" fill="#f59e0b"/>
  </g>

  <!-- Bottom Badge: FRACCIONES -->
  <rect x="90" y="405" width="332" height="52" rx="26" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="256" y="439" fill="#f8fafc" font-size="21" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="3" text-anchor="middle">
    FRACCIONES
  </text>
</svg>
