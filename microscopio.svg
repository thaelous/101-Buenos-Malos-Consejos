<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#05070e"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>
    <linearGradient id="lensRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="atomCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <filter id="qGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#mbg)"/>

  <!-- Microscope Reticle / Focal Ring Grid -->
  <g stroke="#38bdf8" opacity="0.2" stroke-width="1.5">
    <circle cx="256" cy="225" r="165"/>
    <circle cx="256" cy="225" r="120" stroke-dasharray="4,6"/>
    <circle cx="256" cy="225" r="75"/>
    <line x1="256" y1="50" x2="256" y2="400"/>
    <line x1="80" y1="225" x2="432" y2="225"/>
    <!-- Reticle Ticks -->
    <line x1="256" y1="70" x2="264" y2="70" stroke-width="2"/>
    <line x1="256" y1="100" x2="264" y2="100" stroke-width="2"/>
    <line x1="256" y1="350" x2="264" y2="350" stroke-width="2"/>
    <line x1="256" y1="380" x2="264" y2="380" stroke-width="2"/>
  </g>

  <!-- Outer Objective Lens (Sci-Fi Glass Rim) -->
  <circle cx="256" cy="225" r="160" fill="none" stroke="url(#lensRim)" stroke-width="7" opacity="0.85"/>
  <circle cx="256" cy="225" r="150" fill="#0f172a" opacity="0.45"/>

  <!-- Quantum Orbital Ellipses (Electron Cloud) -->
  <g stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.85" filter="url(#qGlow)">
    <ellipse cx="256" cy="225" rx="115" ry="42" transform="rotate(0, 256, 225)"/>
    <ellipse cx="256" cy="225" rx="115" ry="42" transform="rotate(60, 256, 225)" stroke="#a855f7"/>
    <ellipse cx="256" cy="225" rx="115" ry="42" transform="rotate(120, 256, 225)" stroke="#ec4899"/>
  </g>

  <!-- Orbiting Quarks / Electrons -->
  <circle cx="371" cy="225" r="7" fill="#38bdf8" filter="url(#qGlow)"/>
  <circle cx="198" cy="126" r="6" fill="#c084fc" filter="url(#qGlow)"/>
  <circle cx="313" cy="324" r="6" fill="#f472b6" filter="url(#qGlow)"/>

  <!-- Atom Nucleus Glowing Cluster -->
  <g filter="url(#qGlow)">
    <!-- Protons & Neutrons Cluster -->
    <circle cx="244" cy="216" r="22" fill="url(#atomCore)"/>
    <circle cx="268" cy="216" r="20" fill="#a855f7"/>
    <circle cx="256" cy="238" r="21" fill="#06b6d4"/>
    <circle cx="256" cy="225" r="12" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Subatomic energy waves -->
  <circle cx="256" cy="225" r="38" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.5" stroke-dasharray="3,3"/>

  <!-- Bottom Badge: MICROSCOPIO CUÁNTICO -->
  <rect x="55" y="415" width="402" height="52" rx="26" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="256" y="449" fill="#f8fafc" font-size="19" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="2.5" text-anchor="middle">
    MICROSCOPIO CUÁNTICO
  </text>
</svg>
