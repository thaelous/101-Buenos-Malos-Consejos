<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian / Medical Tech Background -->
    <radialGradient id="anatBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#180d24"/>
      <stop offset="45%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#030206"/>
    </radialGradient>

    <!-- Crimson & Rose Cardiovascular Glow -->
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Cyan Neural Brain Glow -->
    <radialGradient id="neuralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Amber Metabolic / Organ Glow -->
    <radialGradient id="vitalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container base -->
  <rect width="512" height="512" rx="110" fill="url(#anatBg)"/>

  <!-- Subtle Medical Grid & Coordinate Circles -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.15" fill="none">
    <circle cx="256" cy="256" r="190"/>
    <circle cx="256" cy="256" r="140" stroke-dasharray="4 4"/>
    <line x1="256" y1="40" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
  </g>

  <!-- Vital Pulse / ECG Wave in Background -->
  <path d="M 60 380 L 170 380 L 190 355 L 205 410 L 225 320 L 245 425 L 260 370 L 275 385 L 285 380 L 452 380"
        fill="none" stroke="#f43f5e" stroke-width="2.5" opacity="0.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Human Torso / Silhouette Outline (Futuristic Translucent Body) -->
  <g fill="none" stroke="#c084fc" stroke-width="2.2" opacity="0.4" stroke-linejoin="round">
    <!-- Head & Neck -->
    <path d="M 230 115 C 230 85 240 68 256 68 C 272 68 282 85 282 115 C 282 135 274 148 268 155 L 272 178 L 240 178 L 244 155 C 238 148 230 135 230 115 Z"/>
    <!-- Shoulders & Torso -->
    <path d="M 272 178 C 300 185 345 198 358 225 C 370 250 365 290 355 330 C 350 350 340 375 332 395 C 315 405 290 412 256 412 C 222 412 197 405 180 395 C 172 375 162 350 157 330 C 147 290 142 250 154 225 C 167 198 212 185 240 178"/>
  </g>

  <!-- Skeletal Spine & Rib Cage Guide -->
  <g stroke="#e9d5ff" stroke-width="1.8" opacity="0.45" fill="none" stroke-linecap="round">
    <!-- Central Vertebral Column -->
    <line x1="256" y1="175" x2="256" y2="390" stroke-width="3" stroke-dasharray="6 4"/>
    <!-- Rib arcs -->
    <path d="M 230 220 Q 210 230 256 242 Q 302 230 282 220"/>
    <path d="M 222 245 Q 198 258 256 272 Q 314 258 290 245"/>
    <path d="M 218 270 Q 192 285 256 302 Q 320 285 294 270"/>
    <path d="M 220 295 Q 196 312 256 328 Q 316 312 292 295"/>
    <path d="M 226 320 Q 206 335 256 348 Q 306 335 286 320"/>
  </g>

  <!-- Respiratory System: Glowing Lungs -->
  <g opacity="0.55" fill="none" stroke="#38bdf8" stroke-width="2">
    <!-- Trachea -->
    <path d="M 256 172 L 256 205 L 240 225 M 256 205 L 272 225" stroke-width="2.5"/>
    <!-- Left Lung Lobe -->
    <path d="M 238 218 C 215 220 205 240 205 270 C 205 298 220 315 240 310 C 248 300 248 260 238 218 Z" fill="#0284c7" fill-opacity="0.25"/>
    <!-- Right Lung Lobe -->
    <path d="M 274 218 C 297 220 307 240 307 270 C 307 298 292 315 272 310 C 264 300 264 260 274 218 Z" fill="#0284c7" fill-opacity="0.25"/>
  </g>

  <!-- Cardiovascular Center: Glowing Heart & Circulatory Tree -->
  <g filter="url(#softGlow)">
    <!-- Heart aura -->
    <circle cx="268" cy="254" r="26" fill="url(#heartGlow)"/>
    <!-- Anatomical Heart silhouette -->
    <path d="M 268 240 C 260 226 244 232 244 246 C 244 262 268 280 268 280 C 268 280 292 262 292 246 C 292 232 276 226 268 240 Z"
          fill="#e11d48" stroke="#ffe4e6" stroke-width="1.8"/>

    <!-- Aorta and Main Arteries (Red/Pink) -->
    <path d="M 268 238 C 266 215 282 205 295 188 M 274 210 L 242 190 M 268 280 L 268 340 L 250 375 M 268 340 L 286 375"
          fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Venous Pathways (Cyan/Blue) -->
    <path d="M 258 246 C 250 225 238 215 225 192 M 258 275 L 258 335 L 238 370 M 258 335 L 278 370"
          fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 3"/>
  </g>

  <!-- Nervous System: Brain & Neural Synapse Nodes -->
  <g filter="url(#softGlow)">
    <!-- Brain Glow in Head -->
    <circle cx="256" cy="110" r="22" fill="url(#neuralGlow)"/>
    <!-- Cerebral hemispheres silhouette -->
    <path d="M 242 115 C 236 100 242 90 254 90 C 256 90 256 122 256 122 M 270 115 C 276 100 270 90 258 90 C 256 90 256 122 256 122"
          fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Neural pulses along spinal cord -->
    <circle cx="256" cy="138" r="3.5" fill="#a5f3fc"/>
    <circle cx="256" cy="168" r="3" fill="#38bdf8"/>
    <circle cx="256" cy="205" r="3" fill="#67e8f9"/>
    <circle cx="256" cy="285" r="3" fill="#38bdf8"/>
    <circle cx="256" cy="350" r="3.5" fill="#a5f3fc"/>
  </g>

  <!-- Stylized DNA Double Helix Accent in Corner -->
  <g transform="translate(82, 100) scale(0.65)" stroke="#ec4899" stroke-width="3" opacity="0.8" fill="none">
    <path d="M 0 0 Q 30 25 0 50 Q -30 75 0 100 Q 30 125 0 150"/>
    <path d="M 0 0 Q -30 25 0 50 Q 30 75 0 100 Q -30 125 0 150" stroke="#8b5cf6"/>
    <!-- Base Pairs -->
    <line x1="-18" y1="20" x2="18" y2="20" stroke="#f472b6" stroke-width="2"/>
    <line x1="-22" y1="75" x2="22" y2="75" stroke="#a78bfa" stroke-width="2"/>
    <line x1="-18" y1="130" x2="18" y2="130" stroke="#f472b6" stroke-width="2"/>
  </g>

  <!-- Interactive Data Callout Rings (Anatomical pins) -->
  <g>
    <!-- Brain tag -->
    <circle cx="282" cy="100" r="4.5" fill="#38bdf8"/>
    <circle cx="282" cy="100" r="8" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <path d="M 288 96 L 330 76 L 365 76" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="365" cy="76" r="2.5" fill="#38bdf8"/>

    <!-- Heart tag -->
    <circle cx="288" cy="248" r="4.5" fill="#f43f5e"/>
    <circle cx="288" cy="248" r="8" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.8"/>
    <path d="M 296 248 L 340 248 L 375 228" fill="none" stroke="#f43f5e" stroke-width="1.2"/>
    <circle cx="375" cy="228" r="2.5" fill="#f43f5e"/>

    <!-- Lungs tag -->
    <circle cx="204" cy="265" r="4" fill="#a855f7"/>
    <circle cx="204" cy="265" r="7" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.8"/>
    <path d="M 198 265 L 155 265 L 130 285" fill="none" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="130" cy="285" r="2.5" fill="#a855f7"/>
  </g>
</svg>
