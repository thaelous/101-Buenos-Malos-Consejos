<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Soothing Deep Midnight / Cyan Indigo -->
    <radialGradient id="cbg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="50%" stop-color="#091b26"/>
      <stop offset="100%" stop-color="#040d14"/>
    </radialGradient>

    <!-- Aurora Neurodiversity Gradient -->
    <linearGradient id="neuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Calming Teal Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Circular Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Canvas Frame -->
  <rect width="512" height="512" rx="110" fill="url(#cbg)"/>

  <!-- Subtle Analytical Grid & Time Coordinates (Chronometer & Sensor lines) -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.16" fill="none">
    <circle cx="256" cy="256" r="215" stroke-dasharray="4 6"/>
    <circle cx="256" cy="256" r="165"/>
    <circle cx="256" cy="256" r="115" stroke-dasharray="2 4"/>
    <circle cx="256" cy="256" r="60"/>
    <!-- Axis lines -->
    <line x1="45" y1="256" x2="467" y2="256"/>
    <line x1="256" y1="45" x2="256" y2="467"/>
    <!-- Subtle 12-hour / analysis ticks around outer circle -->
    <line x1="256" y1="46" x2="256" y2="60" stroke-width="2" opacity="0.4"/>
    <line x1="256" y1="452" x2="256" y2="466" stroke-width="2" opacity="0.4"/>
    <line x1="46" y1="256" x2="60" y2="256" stroke-width="2" opacity="0.4"/>
    <line x1="452" y1="256" x2="466" y2="256" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Ambient soothing glow aura in the center -->
  <circle cx="256" cy="256" r="120" fill="#2dd4bf" opacity="0.08" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="256" r="70" fill="#818cf8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Visual Timeline Wave / Heart-Pulse & Event Curve (Registro de Crisis y Tiempos) -->
  <!-- A gentle cardiogram & crisis amplitude waveform that calms back down into baseline balance -->
  <path d="M 60 256 
           L 130 256 
           Q 150 256 160 270 
           L 175 310 
           L 195 190 
           L 215 340 
           L 235 150 
           L 255 375 
           L 275 140 
           L 295 330 
           L 315 200 
           L 335 295 
           L 350 256 
           L 452 256" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Shaded Area Under the Pulse Curve (Time & Intensity duration) -->
  <path d="M 160 270 
           L 175 310 
           L 195 190 
           L 215 340 
           L 235 150 
           L 255 375 
           L 275 140 
           L 295 330 
           L 315 200 
           L 335 295 
           L 350 256 
           L 160 256 Z"
        fill="#2dd4bf" opacity="0.06"/>

  <!-- Event Timestamp Markers & Sensory Triggers (Puntos de análisis y registro) -->
  <g filter="url(#softGlow)">
    <!-- Event Peak 1 (Duration peak) -->
    <circle cx="255" cy="375" r="5" fill="#f43f5e"/>
    <circle cx="255" cy="375" r="11" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>

    <!-- Event Peak 2 (Intense trigger) -->
    <circle cx="275" cy="140" r="5.5" fill="#fbbf24"/>
    <circle cx="275" cy="140" r="12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>

    <!-- Calming regulation point -->
    <circle cx="350" cy="256" r="5" fill="#2dd4bf"/>
    <circle cx="350" cy="256" r="10" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7"/>

    <!-- Baseline onset point -->
    <circle cx="160" cy="270" r="4" fill="#818cf8"/>
  </g>

  <!-- The Neurodiversity Infinity Ribbon (Símbolo Universal de Neurodivergencia & Conexión) -->
  <!-- Upper loop path with luminous gradient -->
  <path d="M 256 256 
           C 285 205, 335 180, 380 195 
           C 425 210, 445 260, 420 305 
           C 395 345, 335 340, 256 256 
           C 177 172, 117 167, 92 207 
           C 67 252, 87 302, 132 317 
           C 177 332, 227 307, 256 256 Z" 
        fill="none" stroke="url(#neuroGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#intenseGlow)"/>

  <!-- Inner core highlight of the infinity loop for 3D metallic/neon finish -->
  <path d="M 256 256 
           C 285 205, 335 180, 380 195 
           C 425 210, 445 260, 420 305 
           C 395 345, 335 340, 256 256 
           C 177 172, 117 167, 92 207 
           C 67 252, 87 302, 132 317 
           C 177 332, 227 307, 256 256 Z" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Synaptic and Emotional Compass Nodes (Analítica, Factores & Causas) -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <circle cx="395" cy="215" r="4.5"/>
    <circle cx="410" cy="285" r="3.5" fill="#f472b6"/>
    <circle cx="117" cy="295" r="4.5" fill="#38bdf8"/>
    <circle cx="102" cy="225" r="3.5" fill="#2dd4bf"/>
  </g>

  <!-- Central Empathy Core: A glowing beacon representing care, tracking & understanding -->
  <circle cx="256" cy="256" r="14" fill="#091b26" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#softGlow)"/>

  <!-- Compass / Chronometer indicator hands (indicating time tracking) -->
  <line x1="256" y1="256" x2="256" y2="230" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="276" y2="266" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle Top & Bottom Badges / Data Dots -->
  <g opacity="0.6">
    <circle cx="256" cy="95" r="3" fill="#2dd4bf"/>
    <circle cx="236" cy="95" r="2" fill="#38bdf8"/>
    <circle cx="276" cy="95" r="2" fill="#818cf8"/>
    <circle cx="256" cy="417" r="3" fill="#c084fc"/>
    <circle cx="236" cy="417" r="2" fill="#f472b6"/>
    <circle cx="276" cy="417" r="2" fill="#fbbf24"/>
  </g>
</svg>
